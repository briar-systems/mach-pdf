[project]
id = "pdf"
version = "0.1.0"
mach = "^6.8"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library, and the only artifact `mach build .` selects
[artifact.pdf]
kind = "static"
default = true
entry = "lib/pdf.mach"
out = "lib/pdf"
targets = ["*"]
link = []
need = []

# the end-to-end tests no library module reaches
[artifact.tests]
kind = "static"
entry = "test/all.mach"
out = "lib/tests"
targets = ["*"]
link = []
need = []

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[dep.font]
git = "https://github.com/briar-systems/mach-font"
ref = "commit/fde8e42c97e4d326c0a8c7fccfa3aebde4ff7150"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.0"
